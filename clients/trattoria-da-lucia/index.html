<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Name</title>
<meta name="description" content="Website for Business Name" />

<!-- Google Fonts (swap for whatever font matches the brand) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/moods.css" />
</head>
<body>

<header class="site-header" id="top">
  <div class="container header-inner">
    <a class="logo" href="#top" id="logo-link">
      <img id="logo-image" class="logo-image hidden" alt="" />
      <span id="logo-text">BN</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#about">Chi siamo</a>
      <a href="#offerings" id="nav-offerings">Menu</a>
      <a href="#gallery">Galleria</a>
      <a href="#hours">Orari</a>
      <a href="#contact">Contatti</a>
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">&#9776;</button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <h1 id="hero-heading">Welcome</h1>
    <p id="hero-subheading">Subheading goes here</p>
    <a class="btn btn-primary" id="hero-cta" href="#contact">Contact Us</a>
  </div>
</section>

<section class="section" id="about">
  <div class="container about-grid reveal">
    <img id="about-image" src="" alt="About us" />
    <div>
      <h2 id="about-heading">About Us</h2>
      <p id="about-text">About text goes here.</p>
    </div>
  </div>
</section>

<section class="section section-alt" id="offerings">
  <div class="container">
    <h2 id="offerings-heading" class="reveal">Menu</h2>
    <div class="offerings-list" id="offerings-list"></div>
  </div>
</section>

<section class="section" id="gallery">
  <div class="container">
    <h2 id="gallery-heading" class="reveal">Gallery</h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</section>

<section class="section section-alt" id="hours">
  <div class="container hours-grid reveal">
    <div>
      <h2 id="hours-heading">Opening Hours</h2>
      <table class="hours-table" id="hours-table"></table>
    </div>
    <div class="map-embed" id="map-embed"></div>
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <h2 id="contact-heading" class="reveal">Get In Touch</h2>
    <div class="contact-grid reveal">
      <ul class="contact-list" id="contact-list"></ul>
      <div class="socials" id="socials"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <p id="footer-text">Footer text</p>
  </div>
</footer>

<a class="whatsapp-fab hidden" id="whatsapp-fab" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" fill="currentColor" aria-hidden="true">
    <path d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.5 2.1 7.9L.5 31.5l7.8-2.1c2.3 1.3 4.9 2 7.7 2 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5zm0 28.3c-2.5 0-4.9-.7-7-1.9l-.5-.3-4.6 1.2 1.2-4.5-.3-.5C3.4 20.7 2.7 18.4 2.7 16c0-7.4 6-13.4 13.3-13.4S29.3 8.6 29.3 16 23.3 28.8 16 28.8zm7.3-9.9c-.4-.2-2.4-1.2-2.7-1.3-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.3 1.5-.2.3-.5.3-.9.1-.4-.2-1.7-.6-3.2-2-1.2-1-2-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.5.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.9-2.2-1.3-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1 .5-.3.4-1.3 1.3-1.3 3.1 0 1.8 1.3 3.6 1.5 3.9.2.3 2.6 4 6.3 5.5.9.4 1.6.6 2.1.8.9.3 1.7.2 2.3.1.7-.1 2.4-1 2.7-1.9.3-.9.3-1.7.2-1.9-.1-.2-.3-.3-.7-.5z"/>
  </svg>
</a>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#8249;</button>
  <img id="lightbox-image" src="" alt="" />
  <button class="lightbox-next" id="lightbox-next" aria-label="Next image">&#8250;</button>
</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
